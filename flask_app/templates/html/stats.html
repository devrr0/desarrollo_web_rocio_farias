<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <title> Estadísticas - Actividades recreativas </title>
        {% block css %}
        <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
        {% endblock %}
    </head>
    <body>
        <button type="button" class="submit-btn" id="btn-back">Volver al inicio</button>
        {% block content %}
        <div class="main-container">
            <h1> Estadísticas</h1>
            <p class="small-text">A continuación se observan distintas estadísticas construidas <br>con los datos obtenidos de la aplicación web</p>

            <h2>Actividades por día</h2>
            <div class="stats-container">
                <img src="{{ url_for('static', filename='img/actividades_por_dia.png') }}" alt="Actividades por día" >
            </div>

            <h2>Actividades por tipo</h2>
            <div class="stats-container">
                <img src="{{ url_for('static', filename='img/actividades_por_tipo.png') }}" alt="Actividades por tipo" >
            </div>

            <h2>Actividades por hora</h2>
            <div class="stats-container">
                <img src="{{ url_for('static', filename='img/actividades_por_mes.png') }}" alt="Actividades por hora" >
            </div>
        </div>
        {% endblock %}
        {% block javascript %}
            <script lang="javascript" src="{{ url_for('static', filename='js/stats.js') }}"></script>
        {% endblock %}
    </body>

</html>
